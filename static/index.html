<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic AI eBook Chatbot</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f5f6f8; color: #1d2330;
         display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 20px; background: #1d2330; color: #fff; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 13px; color: #b8bfcc; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; max-width: 820px; width: 100%; margin: 0 auto; }
  .msg { padding: 12px 14px; border-radius: 10px; margin-bottom: 14px; line-height: 1.5;
         white-space: pre-wrap; max-width: 90%; }
  .user { background: #2f5bea; color: #fff; margin-left: auto; }
  .bot { background: #fff; border: 1px solid #dfe2e8; }
  .error { background: #fdecec; border: 1px solid #f3b6b6; color: #8a1f1f; }
  .meta { margin-top: 10px; display: flex; gap: 10px; align-items: center; font-size: 13px; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .ok { background: #dff5e4; color: #1b6b32; }
  .no { background: #fdf0d5; color: #8a5a00; }
  details { margin-top: 10px; white-space: normal; }
  summary { cursor: pointer; font-size: 13px; color: #2f5bea; }
  .src { margin-top: 8px; padding: 8px 10px; background: #f5f6f8; border-radius: 8px; font-size: 13px; }
  .src b { display: block; margin-bottom: 4px; }
  .src span { white-space: pre-wrap; color: #3a4252; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chips button { border: 1px solid #c9cfdb; background: #fff; padding: 6px 12px; border-radius: 999px;
                  cursor: pointer; font-size: 13px; }
  form { display: flex; gap: 10px; padding: 14px 20px; background: #fff; border-top: 1px solid #dfe2e8;
         max-width: 820px; width: 100%; margin: 0 auto; }
  input { flex: 1; padding: 10px 12px; border: 1px solid #c9cfdb; border-radius: 8px; font-size: 15px; }
  #send { padding: 10px 18px; border: 0; border-radius: 8px; background: #2f5bea; color: #fff;
          font-size: 15px; cursor: pointer; }
  #send:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Agentic AI eBook Chatbot</h1>
  <p>Answers come only from the Agentic AI eBook. Open "Sources" under an answer to see the passages used.</p>
</header>

<main id="chat">
  <div class="chips" id="chips"></div>
</main>

<form id="form">
  <input id="q" type="text" placeholder="Ask a question about the eBook..." autocomplete="off" required minlength="3">
  <button id="send" type="submit">Send</button>
</form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("q");
const button = document.getElementById("send");

const EXAMPLES = [
  "What is agentic AI?",
  "What are the challenges of orchestrating complex agentic systems?",
  "Who won the 2022 FIFA World Cup?",
];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function formatAnswer(text) {
  const safe = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return safe.replace(/^\s*[*-] /gm, "\u2022 ").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

function scrollDown() {
  chat.scrollTop = chat.scrollHeight;
}

function renderAnswer(bubble, data) {
  bubble.textContent = "";
  const answer = el("div");
  answer.innerHTML = formatAnswer(data.answer);
  bubble.appendChild(answer);

  const meta = el("div", "meta");
  meta.appendChild(el("span", "badge " + (data.grounded ? "ok" : "no"),
    data.grounded ? "Grounded in eBook" : "Not found in eBook"));
  if (data.grounded) {
    meta.appendChild(el("span", "", "Confidence " + data.confidence.toFixed(3)));
  }
  bubble.appendChild(meta);

  if (data.contexts.length) {
    const details = el("details");
    const label = data.grounded
      ? "Sources (" + data.contexts.length + ")"
      : "Closest passages considered, not used (" + data.contexts.length + ")";
    details.appendChild(el("summary", "", label));
    data.contexts.forEach((c) => {
      const box = el("div", "src");
      box.appendChild(el("b", "", "[" + c.rank + "] Page " + c.page +
        " \u00b7 relevance " + c.rerank_score.toFixed(3)));
      box.appendChild(el("span", "", c.text));
      details.appendChild(box);
    });
    bubble.appendChild(details);
  }
}

async function ask(question) {
  chat.appendChild(el("div", "msg user", question));
  const bubble = el("div", "msg bot", "Thinking...");
  chat.appendChild(bubble);
  scrollDown();
  button.disabled = true;
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    if (!res.ok) {
      const detail = typeof data.detail === "string" ? data.detail : "Invalid request";
      throw new Error(detail);
    }
    renderAnswer(bubble, data);
  } catch (err) {
    bubble.className = "msg error";
    bubble.textContent = "Error: " + err.message;
  } finally {
    button.disabled = false;
    input.focus();
    scrollDown();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || button.disabled) return;
  input.value = "";
  ask(q);
});

const chips = document.getElementById("chips");
EXAMPLES.forEach((q) => {
  const b = el("button", "", q);
  b.type = "button";
  b.addEventListener("click", () => { if (!button.disabled) ask(q); });
  chips.appendChild(b);
});
</script>
</body>
</html>
